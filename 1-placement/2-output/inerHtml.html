<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <input type="number" id="v1" placeholder="Enter First Value1">
    <input type="number" id="v2" placeholder="Enter Second Value2">
    <p id="total"></p>
    <bbutton onclick="add()">Add</button>
    <script>
        function add() {
           let v1 = document.getElementById("v1").value;
           let v2 = document.getElementById("v2").value;
           console.log(v1, v2);

           let result =Number(v1)+Number(v2);
           document.getElementById("total").innerHTML = result;
        }
        </script>
